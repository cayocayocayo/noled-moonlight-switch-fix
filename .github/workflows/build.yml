name: build
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@master
      with:
        submodules: recursive

    - name: Build
      run: make -j2

    - name: Upload overlay
      uses: actions/upload-artifact@v4
      with:
        name: noled-diag
        path: noled.ovl
        if-no-files-found: error
